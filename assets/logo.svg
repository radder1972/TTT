<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Single Petal Path - Puffy & Comic Style -->
    <path id="petal" d="M 50,50 C 34,44 26,29 26,18 C 26,7 36,2 50,2 C 64,2 74,7 74,18 C 74,29 66,44 50,50 Z" fill="#FFFFFF" stroke="#8b8b8b" stroke-width="4.5" stroke-linejoin="round" />
  </defs>

  <!-- 5 Petals rotated in pinwheel overlapping fashion -->
  <g id="flower-group">
    <use href="#petal" transform="rotate(36 50 50)" />
    <use href="#petal" transform="rotate(108 50 50)" />
    <use href="#petal" transform="rotate(180 50 50)" />
    <use href="#petal" transform="rotate(252 50 50)" />
    <use href="#petal" transform="rotate(324 50 50)" />
  </g>

  <!-- Central Star - Puffy & Comic Style -->
  <path d="M 50,33 
           C 51.5,38 52.5,41 55,42.5 
           C 57.5,44 61,44 65,45 
           C 61.5,47.5 59,49.5 58,52.5 
           C 57,55.5 58.5,59.5 59.5,63.5 
           C 56,61 53,59.5 50,59.5 
           C 47,59.5 44,61 40.5,63.5 
           C 41.5,59.5 43,55.5 42,52.5 
           C 41,49.5 38.5,47.5 35,45 
           C 39,44 42.5,44 45,42.5 
           C 47.5,41 48.5,38 50,33 Z" 
        fill="#fabb49" stroke="#8b8b8b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
</svg>
